services:
  postgres:
    image: postgres:16-alpine
    container_name: report_v_4_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    container_name: report_v_4_bot
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    # Обход проблемы маршрутизации на некоторых хостингах (в т.ч. Timeweb,
    # СПб): DNS резолвит api.telegram.org в 149.154.166.110, который
    # оказывается недоступен (стабильно таймаутит), хотя другие IP
    # Telegram (например 149.154.167.220) отвечают нормально. Если после
    # починки маршрута на стороне хостера проблема уйдет — эту строку
    # можно убрать
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: report_v_4_dashboard
    command: uvicorn app.dashboard.main:app --host 0.0.0.0 --port 8080
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    # Порт публикуется только на loopback самого сервера — снаружи
    # недоступен, вход только через SSH-туннель (см. ROADMAP: дашборд без
    # домена/TLS не выставляется в открытый интернет)
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
