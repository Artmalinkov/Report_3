[pytest]
asyncio_mode = auto
; Один event loop на всю тестовую сессию, а не новый на каждый async-тест:
; движок SQLAlchemy (app/database/session.py) создается один раз при
; импорте и на Windows+asyncpg "плывет" между разными event loop'ами
; ("Event loop is closed" при переиспользовании пула соединений)
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = app/tests
